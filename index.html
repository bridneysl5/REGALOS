<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Momentos365 | Regalos personalizados y delivery de flores en Lima</title>
    <meta
      name="description"
      content="Regalos personalizados en Lima: arreglos de flores, ramos de girasoles, tortas, cuadros y gift boxes. Delivery en Miraflores, Santa Anita y alrededores. Pide por WhatsApp."
    />
    <link rel="canonical" href="https://momentos365.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ce293b" />

    <!-- Vista previa al compartir (WhatsApp, Facebook, Instagram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Momentos365" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:title" content="Momentos365 | Regalos personalizados y delivery de flores en Lima" />
    <meta
      property="og:description"
      content="Arreglos de flores, ramos de girasoles, tortas, cuadros y gift boxes con delivery en Lima. Miraflores, Santa Anita y alrededores."
    />
    <meta property="og:image" content="https://momentos365.com/images/logo.png" />
    <meta property="og:url" content="https://momentos365.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />

    <!-- Datos del negocio para Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Momentos365",
        "description": "Regalos personalizados, arreglos de flores, tortas y gift boxes con delivery en Lima.",
        "url": "https://momentos365.com/",
        "image": "https://momentos365.com/images/logo.png",
        "telephone": "+51916098803",
        "priceRange": "S/",
        "currenciesAccepted": "PEN",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lima",
          "addressRegion": "Lima",
          "addressCountry": "PE"
        },
        "areaServed": [
          { "@type": "City", "name": "Lima" },
          { "@type": "AdministrativeArea", "name": "Miraflores" },
          { "@type": "AdministrativeArea", "name": "Santa Anita" }
        ],
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
